[package]
name = "basalt-plugin-semantic-facts-typescript"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# serde feature required: without it serialize_facts is a stub returning empty.
basalt-plugin-sdk = { path = "../basalt-plugin-sdk", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1